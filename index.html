<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recrutamento - Albion Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-xl w-full bg-gray-800 rounded-xl shadow-2xl p-6 border border-gray-700">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-bold text-amber-400 mb-2">⚔️ Formulário de Recrutamento</h1>
      <p class="text-gray-400 text-sm">Preencha seus dados para solicitar entrada na guilda</p>
    </div>

    <form id="recruitmentForm" class="space-y-4">
      
      <!-- Nick no Jogo -->
      <div>
        <label class="block text-sm font-semibold mb-1 text-gray-300">Nick no Jogo (Albion):</label>
        <input type="text" id="gameNick" required placeholder="Ex: PlayerOne"
               class="w-full bg-gray-900 border border-gray-700 rounded p-3 text-white focus:outline-none focus:border-amber-400">
      </div>

      <!-- Tag / Nick no Discord -->
      <div>
        <label class="block text-sm font-semibold mb-1 text-gray-300">Seu Nick/Username do Discord ou ID:</label>
        <input type="text" id="discordTag" required placeholder="Ex: eduardopython ou ID"
               class="w-full bg-gray-900 border border-gray-700 rounded p-3 text-white focus:outline-none focus:border-amber-400">
      </div>

      <!-- Arma Principal -->
      <div>
        <label class="block text-sm font-semibold mb-1 text-gray-300">Arma Principal:</label>
        <select id="mainWeapon" required class="w-full bg-gray-900 border border-gray-700 rounded p-3 text-white focus:outline-none focus:border-amber-400">
          <option value="">Selecione a Arma...</option>
          <optgroup label="Espadas">
            <option value="Espada larga">Espada Larga</option>
            <option value="Criadora de Reis">Criadora de Reis</option>
            <option value="Lâmina Entalhada">Lâmina Entalhada</option>
          </optgroup>
          <optgroup label="Arcos">
            <option value="Arco Badônico">Arco Badônico</option>
            <option value="Arco Sussurrante">Arco Sussurrante</option>
            <option value="Arco Longo">Arco Longo</option>
          </optgroup>
          <optgroup label="Machados">
            <option value="Machadinha">Machadinha</option>
            <option value="Pata de Urso">Pata de Urso</option>
            <option value="Segadeira das Sombras">Segadeira das Sombras</option>
          </optgroup>
          <optgroup label="Cajados">
            <option value="Cajado de Fogo">Cajado de Fogo</option>
            <option value="Cajado Sagrado">Cajado Sagrado</option>
            <option value="Cajado de Geada">Cajado de Geada</option>
          </optgroup>
        </select>
      </div>

      <!-- Spec da Arma -->
      <div>
        <label class="block text-sm font-semibold mb-1 text-gray-300">Especialização (Spec) da Arma Principal:</label>
        <input type="number" id="weaponSpec" min="0" max="120" required placeholder="Ex: 100"
               class="w-full bg-gray-900 border border-gray-700 rounded p-3 text-white focus:outline-none focus:border-amber-400">
      </div>

      <!-- Conteúdos / Atividades (Checkboxes) -->
      <div>
        <label class="block text-sm font-semibold mb-2 text-gray-300">Atividades de Interesse:</label>
        <div class="grid grid-cols-2 gap-2 text-sm">
          <label class="bg-gray-900 p-3 rounded border border-gray-700 flex items-center space-x-2 cursor-pointer hover:border-amber-400">
            <input type="checkbox" name="roles" value="ZvZ" class="accent-amber-400">
            <span>ZvZ</span>
          </label>
          <label class="bg-gray-900 p-3 rounded border border-gray-700 flex items-center space-x-2 cursor-pointer hover:border-amber-400">
            <input type="checkbox" name="roles" value="Ganking" class="accent-amber-400">
            <span>Ganking</span>
          </label>
          <label class="bg-gray-900 p-3 rounded border border-gray-700 flex items-center space-x-2 cursor-pointer hover:border-amber-400">
            <input type="checkbox" name="roles" value="Guerra de Facção" class="accent-amber-400">
            <span>Guerra de Facção</span>
          </label>
          <label class="bg-gray-900 p-3 rounded border border-gray-700 flex items-center space-x-2 cursor-pointer hover:border-amber-400">
            <input type="checkbox" name="roles" value="PvE / HCE" class="accent-amber-400">
            <span>PvE / HCE</span>
          </label>
          <label class="bg-gray-900 p-3 rounded border border-gray-700 flex items-center space-x-2 cursor-pointer hover:border-amber-400">
            <input type="checkbox" name="roles" value="Coletor / Booster" class="accent-amber-400">
            <span>Coletor / Booster</span>
          </label>
        </div>
      </div>

      <!-- Botão de Enviar -->
      <button type="submit" id="submitBtn"
              class="w-full bg-amber-500 hover:bg-amber-600 text-gray-900 font-bold py-3 rounded transition duration-200 shadow-lg mt-4">
        Enviar Para Análise ⚔️
      </button>
    </form>
  </div>

  <script>
    const form = document.getElementById('recruitmentForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      submitBtn.disabled = true;
      submitBtn.innerText = 'ENVIANDO APLICAÇÃO... ⏳';

      // 1. Pega o ID da guilda vindo do link (ex: ?guild=123456789)
      const urlParams = new URLSearchParams(window.location.search);
      
      // ⚠️ COLOQUE O ID DO SEU SERVIDOR PADRÃO DENTRO DAS ASPAS ABAIXO:
      const DEFAULT_GUILD_ID = "1531673006064275739"; 
      
      const guildId = urlParams.get('guild') || DEFAULT_GUILD_ID;

      const gameNick = document.getElementById('gameNick').value;
      const discordTag = document.getElementById('discordTag').value;
      const mainWeapon = document.getElementById('mainWeapon').value;
      const weaponSpec = document.getElementById('weaponSpec').value;

      const selectedRoles = Array.from(document.querySelectorAll('input[name="roles"]:checked'))
                                 .map(cb => cb.value);

      try {
        // ⚠️ Troque a URL abaixo pela sua URL exata do Render:
        const response = await fetch('https://bot-recrutador.onrender.com', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            gameNick,
            discordTag,
            roles: selectedRoles,
            mainWeapon,
            weaponSpec,
            guildId: guildId
          })
        });

        const data = await response.json();

        if (response.ok) {
          alert('✅ Aplicação enviada com sucesso! Aguarde a análise no Discord.');
          form.reset();
        } else {
          alert('❌ Ocorreu um erro: ' + (data.error || 'Erro desconhecido ao enviar.'));
        }
      } catch (err) {
        console.error(err);
        alert('❌ Não foi possível conectar ao servidor do Bot.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Enviar Para Análise ⚔️';
      }
    });
  </script>
</body>
</html>
