<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alistamento Amigos do Blackjack</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: radial-gradient(circle at center, #1a1c23 0%, #0d0e12 100%); }
    .gold-border { border: 1px solid #d4af37; box-shadow: 0 0 15px rgba(212, 175, 55, 0.15); }
    .gold-button { background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%); }
  </style>
</head>
<body class="text-gray-200 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-2xl w-full bg-gray-900/90 rounded-xl p-8 gold-border my-8">
    <h1 class="text-3xl font-extrabold text-amber-400 text-center uppercase mb-6">⚔️ Recrutamento do Blackjack ⚔️</h1>

    <form id="recruitmentForm" class="space-y-6">
      
      <!-- Nicks -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-amber-400 font-bold mb-2 text-xs uppercase">Nick no Jogo</label>
          <input type="text" id="gameNick" required placeholder="Ex: PlayerOne" class="w-full bg-gray-800 border border-gray-700 rounded p-3 text-white">
        </div>
        <div>
          <label class="block text-amber-400 font-bold mb-2 text-xs uppercase">Username ou ID do Discord</label>
          <input type="text" id="discordTag" required placeholder="Ex: eduardopython ou ID" class="w-full bg-gray-800 border border-gray-700 rounded p-3 text-white">
        </div>
      </div>

      <!-- Conteúdos para Cargos Automáticos -->
      <div>
        <label class="block text-amber-400 font-bold mb-2 text-xs uppercase">Conteúdos Preferidos (Gera Cargos)</label>
        <div class="grid grid-cols-2 gap-2">
          <label class="bg-gray-800 p-3 rounded border border-gray-700 flex items-center space-x-2">
            <input type="checkbox" name="roles" value="Ganking" class="accent-amber-400">
            <span>Ganking</span>
          </label>
          <label class="bg-gray-800 p-3 rounded border border-gray-700 flex items-center space-x-2">
            <input type="checkbox" name="roles" value="Guerra de Facção" class="accent-amber-400">
            <span>Guerra de Facção</span>
          </label>
          <label class="bg-gray-800 p-3 rounded border border-gray-700 flex items-center space-x-2">
            <input type="checkbox" name="roles" value="ZvZ" class="accent-amber-400">
            <span>ZvZ</span>
          </label>
          <label class="bg-gray-800 p-3 rounded border border-gray-700 flex items-center space-x-2">
            <input type="checkbox" name="roles" value="PvE / HCE" class="accent-amber-400">
            <span>PvE / HCE</span>
          </label>
        </div>
      </div>

      <!-- Seleção Direta de Armas -->
      <div class="space-y-3">
        <label class="block text-amber-400 font-bold text-xs uppercase">Sua Arma Principal</label>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <select id="mainWeapon" required class="bg-gray-800 border border-gray-700 rounded p-3 text-white">
            <option value="">Selecione a Arma...</option>
            <optgroup label="Arcos">
              <option value="Arco Badônico">Arco Badônico</option>
              <option value="Arco Sussurrante">Arco Sussurrante</option>
              <option value="Arco Longo">Arco Longo</option>
            </optgroup>
            <optgroup label="Espadas">
              <option value="Espada Larga">Espada Larga</option>
              <option value="Criadora de Reis">Criadora de Reis</option>
              <option value="Claidheamh Mór">Claidheamh Mór</option>
            </optgroup>
            <optgroup label="Cajados Cursados">
              <option value="Cajado Malfazejo">Cajado Malfazejo</option>
              <option value="Cajado da Sombra">Cajado da Sombra</option>
            </optgroup>
          </select>

          <select id="weaponSpec" required class="bg-gray-800 border border-gray-700 rounded p-3 text-white">
            <option value="">Nível de Espec...</option>
            <option value="1 a 50">1 a 50 Espec</option>
            <option value="50 a 99">50 a 99 Espec</option>
            <option value="100/120">100 / 120 Espec</option>
            <option value="120/120 (Full)">120 / 120 (Max)</option>
          </select>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="w-full gold-button text-black font-black py-4 rounded uppercase tracking-wider transition-opacity duration-200 hover:opacity-90">
        Enviar Para Análise ⚔️
      </button>
    </form>
  </div>

  <script>
    const form = document.getElementById('recruitmentForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      submitBtn.disabled = true;
      submitBtn.innerText = 'ENVIANDO APLICAÇÃO... ⏳';

      const gameNick = document.getElementById('gameNick').value;
      const discordTag = document.getElementById('discordTag').value;
      const mainWeapon = document.getElementById('mainWeapon').value;
      const weaponSpec = document.getElementById('weaponSpec').value;

      const selectedRoles = Array.from(document.querySelectorAll('input[name="roles"]:checked'))
                                 .map(cb => cb.value);

      try {
        const response = await fetch('https://bot-recrutador.onrender.com/api/apply', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            gameNick,
            discordTag,
            roles: selectedRoles,
            mainWeapon,
            weaponSpec
          })
        });

        const data = await response.json();

        if (response.ok) {
          alert('✅ Aplicação enviada com sucesso!');
          form.reset();
        } else {
          alert('❌ Ocorreu um erro: ' + (data.error || 'Erro desconhecido ao enviar.'));
        }
      } catch (err) {
        console.error(err);
        alert('❌ Não foi possível conectar ao servidor do Bot.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Enviar Para Análise ⚔️';
      }
    });
  </script>

</body>
</html>
