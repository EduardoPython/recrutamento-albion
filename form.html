<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recrutamento - Guilda</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }
        .form-control, .form-select {
            background-color: #2b2b2b;
            border: 1px solid #404040;
            color: #ffffff;
        }
        .form-control:focus, .form-select:focus {
            background-color: #2b2b2b;
            color: #ffffff;
            border-color: #f1c40f;
            box-shadow: 0 0 0 0.25rem rgba(241, 196, 15, 0.25);
        }
        .btn-primary {
            background-color: #f1c40f;
            border-color: #f1c40f;
            color: #000;
            font-weight: bold;
        }
        .btn-primary:hover {
            background-color: #d4ac0d;
            border-color: #d4ac0d;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="col-md-6 col-lg-5">
            <div class="card p-4 p-md-5">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-warning">⚔️ Recrutamento</h2>
                    <p class="text-muted">Preencha os dados abaixo para se juntar à nossa guilda</p>
                </div>

                <form id="applyForm">
                    <!-- Campo oculto para guardar o ID da Guilda pego pela URL -->
                    <input type="hidden" id="guildId" name="guildId">

                    <!-- Nick no Jogo -->
                    <div class="mb-3">
                        <label for="gameNick" class="form-label">Seu Nick no Albion</label>
                        <input type="text" class="form-control" id="gameNick" name="gameNick" placeholder="Ex: NomeDoJogador" required>
                    </div>

                    <!-- Tag do Discord -->
                    <div class="mb-3">
                        <label for="discordTag" class="form-label">Seu usuário do Discord</label>
                        <input type="text" class="form-control" id="discordTag" name="discordTag" placeholder="Ex: seuusuario ou seuusuario#0000" required>
                    </div>

                    <!-- ID do Discord (Opcional, para marcação direta) -->
                    <div class="mb-3">
                        <label for="discordUserId" class="form-label">ID do Usuário do Discord <small class="text-muted">(Opcional)</small></label>
                        <input type="text" class="form-control" id="discordUserId" name="discordUserId" placeholder="Ex: 123456789012345678">
                    </div>

                    <!-- Arma Principal (Texto Livre) -->
                    <div class="mb-3">
                        <label for="mainWeapon" class="form-label">Qual é a sua Arma Principal?</label>
                        <input type="text" class="form-control" id="mainWeapon" name="mainWeapon" placeholder="Ex: Cajado do Oculto, Espada Amaldiçoada..." required>
                    </div>

                    <!-- Checkbox de Novato -->
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="isNewbie" name="isNewbie">
                        <label class="form-check-label text-light" for="isNewbie">Sou Novato / Iniciante</label>
                    </div>

                    <!-- Upload da Print de Atributos / Fama -->
                    <div class="mb-4">
                        <label for="statsImage" class="form-label">Print dos Atributos / Fama Total (Perfil)</label>
                        <input type="file" class="form-control" id="statsImage" name="statsImage" accept="image/*" required>
                        <div class="form-text text-muted">Envie uma imagem legível mostrando sua fama total e atributos.</div>
                    </div>

                    <!-- Botão de Envio -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">Enviar Ficha</button>
                    </div>
                </form>

                <!-- Mensagem de Resposta -->
                <div id="responseMessage" class="mt-3 text-center"></div>
            </div>
        </div>
    </div>

    <!-- Script para capturar o ID da guilda na URL e enviar via API -->
    <script>
        // Pega o ID da guilda passado via URL (Ex: form.html?guild=123456789)
        const urlParams = new URLSearchParams(window.location.search);
        const guildIdFromUrl = urlParams.get('guild');

        if (guildIdFromUrl) {
            document.getElementById('guildId').value = guildIdFromUrl;
        } else {
            alert('⚠️ Link de recrutamento inválido! Certifique-se de usar o link gerado pelo comando /setar-canal no Discord.');
        }

        // Função para converter o arquivo de imagem em Base64
        const convertFileToBase64 = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = (error) => reject(error);
            });
        };

        document.getElementById('applyForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const responseDiv = document.getElementById('responseMessage');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Enviando...';
            responseDiv.innerHTML = '';

            const gameNick = document.getElementById('gameNick').value;
            const discordTag = document.getElementById('discordTag').value;
            const discordUserId = document.getElementById('discordUserId').value;
            const mainWeapon = document.getElementById('mainWeapon').value;
            const isNewbie = document.getElementById('isNewbie').checked;
            const guildId = document.getElementById('guildId').value;
            const imageFile = document.getElementById('statsImage').files[0];

            let statsImageBase64 = null;
            if (imageFile) {
                try {
                    statsImageBase64 = await convertFileToBase64(imageFile);
                } catch (err) {
                    console.error('Erro ao converter imagem:', err);
                }
            }

            const payload = {
                gameNick,
                discordTag,
                discordUserId,
                mainWeapon,
                isNewbie,
                guildId,
                statsImageBase64
            };

            try {
                // Altere a URL abaixo caso seu bot esteja hospedado em outro servidor (ex: Render, Railway, etc)
                const response = await fetch('/api/apply', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (response.ok) {
                    responseDiv.innerHTML = '<div class="alert alert-success">✅ Ficha enviada com sucesso! Verifique seu Discord em breve.</div>';
                    document.getElementById('applyForm').reset();
                    if (guildIdFromUrl) document.getElementById('guildId').value = guildIdFromUrl;
                } else {
                    responseDiv.innerHTML = `<div class="alert alert-danger">❌ ${result.error || 'Erro ao enviar ficha.'}</div>`;
                }
            } catch (error) {
                console.error('Erro:', error);
                responseDiv.innerHTML = '<div class="alert alert-danger">❌ Erro de conexão com o servidor. Tente novamente mais tarde.</div>';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Enviar Ficha';
            }
        });
    </script>
</body>
</html>
